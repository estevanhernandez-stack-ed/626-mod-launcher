# 626 Mod Launcher -- the release test gate, run on every PR and every push to master.
#
# release.yml runs these same two suites, but only when a tag is pushed, so a test that breaks on
# the runner first shows up at release time. v0.24.0 hit exactly that: a test passed on a dev box
# (checkout and temp both on C:) and failed on the runner (checkout on D:, temp on C:). Same runner
# image, same commands as the release gate, so a green PR means a green tag-time test step.

name: test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Core + Nexus validate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true   # external/626-mod-plugins, as in release.yml

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (Core)
        # Explicit test project — bare `dotnet test` at the solution root hangs building WinUI.
        run: dotnet test tests/ModManager.Tests/ModManager.Tests.csproj --configuration Release --logger "console;verbosity=minimal"

      - name: Test (Nexus key validate)
        run: dotnet test tests/ModManager.App.NexusValidate.Tests/ModManager.App.NexusValidate.Tests.csproj --configuration Release --logger "console;verbosity=minimal"
